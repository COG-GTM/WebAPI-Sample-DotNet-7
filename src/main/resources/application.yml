server:
  port: 5000

spring:
  application:
    name: webapi-sample
  # Override with SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
  datasource:
    url: jdbc:postgresql://localhost:5433/SampleDB
    username: sara
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    # Databases created by the former EF Core migration already contain V1; adopt them instead of failing.
    baseline-on-migrate: true
    baseline-version: 1

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
